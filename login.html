<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In – ListHub</title>
    <meta name="description" content="Log in to your ListHub account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: blobMove 10s ease-in-out infinite;
        }

        .bg-blob-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.25), transparent);
            top: -200px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-blob-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 107, 107, 0.15), transparent);
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        .bg-blob-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(67, 229, 160, 0.12), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -7s;
        }

        @keyframes blobMove {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -40px) scale(1.05);
            }

            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
        }

        /* Slide-in card */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            margin: 24px;
            background: rgba(30, 34, 64, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 44px 40px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(108, 99, 255, 0.1);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .card-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 22px;
            color: var(--text);
            margin-bottom: 32px;
            text-decoration: none;
        }

        .card-logo .logo-icon {
            font-size: 26px;
            background: linear-gradient(135deg, #6C63FF, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Title */
        .card-title {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: var(--text);
        }

        .card-sub {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .card-sub a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .card-sub a:hover {
            text-decoration: underline;
        }

        /* Fields */
        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .field-label a {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .field-label a:hover {
            text-decoration: underline;
        }

        .input-wrap {
            position: relative;
        }

        .auth-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 13px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: all 0.25s;
        }

        .auth-input::placeholder {
            color: var(--text-dim);
        }

        .auth-input:focus {
            border-color: var(--primary);
            background: rgba(108, 99, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        .auth-input.has-icon {
            padding-right: 46px;
        }

        .auth-input.error {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }

        .field-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 16px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .field-icon:hover {
            color: var(--text-muted);
        }

        .err-msg {
            font-size: 12px;
            color: #FF6B6B;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .err-msg.show {
            display: flex;
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6C63FF, #A78BFA);
            color: #fff;
            border: none;
            border-radius: 13px;
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 6px 24px rgba(108, 99, 255, 0.35);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 36px rgba(108, 99, 255, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Spinner */
        .spin {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: rot 0.65s linear infinite;
        }

        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.5px;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
        }

        /* Footer link */
        .card-footer {
            text-align: center;
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 24px;
        }

        .card-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        /* Success overlay */
        .success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 14px;
            padding: 16px 0;
        }

        .success-view.show {
            display: flex;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #43E5A0, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes pop {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 800;
        }

        .success-sub {
            font-size: 14px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <div class="auth-card">

        <!-- FORM VIEW -->
        <div id="formView">
            <a href="index.html" class="card-logo">
                <span class="logo-icon">⬡</span>
                ListHub
            </a>

            <h1 class="card-title">Welcome back 👋</h1>

            <!-- Email -->
            <div class="field">
                <label class="field-label" for="email">Email Address</label>
                <div class="input-wrap">
                    <input type="email" id="email" class="auth-input has-icon" placeholder="you@example.com"
                        autocomplete="email" />
                    <span class="field-icon">✉️</span>
                </div>
                <span class="err-msg" id="emailErr">⚠ Please enter a valid email address.</span>
            </div>

            <!-- Password -->
            <div class="field">
                <label class="field-label" for="password">
                    Password
                    <a href="#">Forgot password?</a>
                </label>
                <div class="input-wrap">
                    <input type="password" id="password" class="auth-input has-icon" placeholder="Enter your password"
                        autocomplete="current-password" />
                    <button class="field-icon" type="button" onclick="toggleVis('password', this)" tabindex="-1"
                        id="eyeBtn">
                        <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        <svg id="eyeClose" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="display:none">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                            <line x1="1" y1="1" x2="23" y2="23" />
                        </svg>
                    </button>
                </div>
                <span class="err-msg" id="passErr">⚠ Password must be at least 8 characters.</span>
            </div>

            <button class="btn-submit" id="loginBtn" onclick="doLogin()">
                <div class="spin" id="spin"></div>
                <span id="btnText">Log In</span>
            </button>

            <div class="card-footer">
                Don't have an account? <a href="signup.html">Sign up free →</a>
            </div>

        </div>


        <!-- SUCCESS VIEW -->
        <div class="success-view" id="successView">
            <div class="success-icon">✓</div>
            <div class="success-title">You're logged in!</div>
            <div class="success-sub">Redirecting you to the homepage…</div>
            <a href="index.html" style="margin-top:12px;" class="btn-submit" onclick="void(0)">Go to Homepage →</a>
        </div>

    </div>

    <script type="module">
        import { signInEmail, signInGoogle } from './firebase.js';

        window.toggleVis = function (id, btn) {
            const inp = document.getElementById(id);
            const isPass = inp.type === 'password';
            inp.type = isPass ? 'text' : 'password';
            document.getElementById('eyeOpen').style.display = isPass ? 'none' : 'block';
            document.getElementById('eyeClose').style.display = isPass ? 'block' : 'none';
        };

        function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

        function setErr(inputId, errId, show) {
            document.getElementById(inputId).classList.toggle('error', show);
            document.getElementById(errId).classList.toggle('show', show);
        }

        function showBanner(msg) {
            let banner = document.getElementById('authBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'authBanner';
                banner.style.cssText = 'margin-top:12px;padding:10px 14px;background:rgba(255,107,107,0.12);border:1px solid rgba(255,107,107,0.35);border-radius:10px;font-size:13px;color:#FF6B6B;text-align:center;';
                document.getElementById('loginBtn').after(banner);
            }
            banner.textContent = msg;
            banner.style.display = 'block';
        }

        function setLoading(on) {
            const btn = document.getElementById('loginBtn');
            btn.disabled = on;
            document.getElementById('spin').style.display = on ? 'block' : 'none';
            document.getElementById('btnText').style.display = on ? 'none' : 'block';
        }

        function showSuccess() {
            document.getElementById('formView').style.display = 'none';
            document.getElementById('successView').classList.add('show');
            setTimeout(() => window.location.href = 'index.html', 2500);
        }

        window.doLogin = async function () {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            let ok = true;

            if (!isEmail(email)) { setErr('email', 'emailErr', true); ok = false; }
            else { setErr('email', 'emailErr', false); }
            if (pass.length < 6) { setErr('password', 'passErr', true); ok = false; }
            else { setErr('password', 'passErr', false); }
            if (!ok) return;

            setLoading(true);
            try {
                await signInEmail(email, pass);
                showSuccess();
            } catch (err) {
                setLoading(false);
                const msgs = {
                    'auth/user-not-found': 'No account found with this email.',
                    'auth/wrong-password': 'Incorrect password. Please try again.',
                    'auth/invalid-credential': 'Incorrect email or password.',
                    'auth/too-many-requests': 'Too many attempts. Please wait and try again.',
                    'auth/user-disabled': 'This account has been disabled.',
                    'auth/network-request-failed': 'Network error — check your connection.'
                };
                showBanner(msgs[err.code] || 'Login failed: ' + err.message);
            }
        };

        window.doGoogleLogin = async function () {
            try {
                await signInGoogle();
                showSuccess();
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showBanner('Google sign-in failed. Please try again.');
                }
            }
        };

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) window.doLogin();
        });
    </script>


</body>

</html>
